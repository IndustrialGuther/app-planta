<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pizarra TV & Control de Planta</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Estilos Pizarra TV */
    .pizarra-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-mute { padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 20px; border: none; cursor: pointer; }
    .btn-mute.active { background-color: #dc3545; color: white; }
    .btn-mute.muted { background-color: #6c757d; color: white; }

    .grid-naves { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    .card-nave { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-maquina { border: 2px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 10px; position: relative; background: #fff; }
    .card-maquina.corriendo { border-left: 6px solid #28a745; }
    .card-maquina.ajuste { border-left: 6px solid #ffc107; }
    .card-maquina.setup { border-left: 6px solid #17a2b8; }

    /* Alarma Parpadeante */
    @keyframes blink-red {
      0% { border-color: #dc3545; box-shadow: 0 0 10px #dc3545; }
      50% { border-color: #e0e0e0; box-shadow: none; }
      100% { border-color: #dc3545; box-shadow: 0 0 10px #dc3545; }
    }
    .card-maquina.alarmed {
      animation: blink-red 1s infinite;
      border-width: 3px !important;
    }

    .badge-time { font-size: 12px; font-weight: bold; color: #d9534f; background: #fdf2f2; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 13px; margin-top: 5px; }
    
    /* Tablas */
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #343a40; color: white; }
  </style>
</head>
<body>

  <!-- Navegación -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('pizarra')">Pizarra TV</button>
    <button class="tab-btn" onclick="switchTab('operadores')">Registro Operadores</button>
    <button class="tab-btn" onclick="switchTab('alarma')">Control de Alarma</button>
  </div>

  <!-- SECCIÓN PIZARRA TV -->
  <div id="pizarra" class="tab-content active">
    <div class="pizarra-header">
      <h2>Pizarra TV - Monitor de Planta en Vivo</h2>
      <div>
        <label>Filtrar Fecha/Hora Inicio: </label>
        <input type="datetime-local" id="filterInicio">
        <label>Fin: </label>
        <input type="datetime-local" id="filterFin">
        <button onclick="cargarPizarra()">Filtrar</button>
        <button class="btn-mute muted" id="muteBtn" onclick="toggleMute()">🔊 Sonido: ACTIVADO</button>
      </div>
    </div>
    <div class="grid-naves" id="containerPizarra"></div>
  </div>

  <!-- SECCIÓN REGISTRO OPERADORES -->
  <div id="operadores" class="tab-content">
    <h2>Registro de Operadores</h2>
    <table id="tablaOperadores">
      <thead>
        <tr>
          <th>Máquina</th>
          <th>Operador</th>
          <th>Turno</th>
          <th>Fecha Registro</th>
          <th>Última Actualización</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- SECCIÓN CONTROL DE ALARMA (ADMIN) -->
  <div id="alarma" class="tab-content">
    <h2>Control de Alarma de Tiempo Excedido</h2>
    <div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px;">
      <label for="limitMinutes"><b>Tiempo Límite para Alarma (Minutos):</b></label><br><br>
      <input type="number" id="limitMinutes" value="150" min="1" style="width: 100%; padding: 8px;"><br><br>
      <button onclick="guardarConfigAlarma()" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Guardar Configuración</button>
    </div>
  </div>

  <script>
    let alarmThresholdMin = 150;
    let isMuted = false;
    let audioCtx = null;
    let pizarraDataCache = [];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'pizarra') cargarPizarra();
      if (tabId === 'operadores') cargarOperadores();
      if (tabId === 'alarma') cargarConfigAlarma();
    }

    // --- MANEJO DE AUDIO Y ALARMA ---
    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('muteBtn');
      if (isMuted) {
        btn.className = 'btn-mute muted';
        btn.innerText = '🔇 Sonido: SILENCIADO';
      } else {
        btn.className = 'btn-mute active';
        btn.innerText = '🔊 Sonido: ACTIVADO';
      }
    }

    function triggerBeep() {
      if (isMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono de alarma
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {
        console.log('Audio Context Error', e);
      }
    }

    // --- CARGA Y RENDERIZADO DE PIZARRA TV ---
    function cargarPizarra() {
      const fInicio = document.getElementById('filterInicio').value;
      const fFin = document.getElementById('filterFin').value;

      const filtros = (fInicio && fFin) ? { fechaHoraInicio: fInicio, fechaHoraFin: fFin } : null;

      google.script.run.withSuccessHandler(res => {
        pizarraDataCache = res.registros;
        alarmThresholdMin = res.alarmMinutes;
        renderPizarra();
      }).getPizarraData(filtros);
    }

    function renderPizarra() {
      const container = document.getElementById('containerPizarra');
      container.innerHTML = '';

      // Agrupar por nave (Excluyendo "Sin Nave")
      const naves = {};
      let hasAlarmTriggered = false;
      const now = new Date();

      pizarraDataCache.forEach(item => {
        if (!item.nave || item.nave.trim().toLowerCase() === 'sin nave') return;
        if (!naves[item.nave]) naves[item.nave] = [];
        naves[item.nave].push(item);
      });

      Object.keys(naves).forEach(naveName => {
        const naveCard = document.createElement('div');
        naveCard.className = 'card-nave';
        naveCard.innerHTML = `<h3>Nave: ${naveName}</h3>`;

        naves[naveName].forEach(reg => {
          let elapsedMin = 0;
          let isPendingOrActive = !reg.horaFin;
          
          if (reg.horaInicio) {
            const start = new Date(reg.horaInicio);
            const end = reg.horaFin ? new Date(reg.horaFin) : now;
            elapsedMin = Math.floor((end - start) / 60000);
          }

          const isAlarmed = isPendingOrActive && (elapsedMin >= alarmThresholdMin);
          if (isAlarmed) hasAlarmTriggered = true;

          const estadoClass = reg.estado.toLowerCase();
          const card = document.createElement('div');
          card.className = `card-maquina ${estadoClass} ${isAlarmed ? 'alarmed' : ''}`;

          // Formato de hora inicio/fin
          const hInicioStr = reg.horaInicio ? new Date(reg.horaInicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A';
          const hFinStr = reg.horaFin ? new Date(reg.horaFin).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'En curso';

          // Renderizado detallado con Piezas, Técnico, Operador y Duración
          card.innerHTML = `
            <strong>${reg.maquina}</strong> - <span style="text-transform:uppercase;">${reg.estado}</span>
            <div class="details-grid">
              <div><b>Item:</b> ${reg.item || 'N/A'}</div>
              <div><b>Técnico:</b> ${reg.tecnico || 'N/A'}</div>
              <div><b>Operador:</b> ${reg.operador || 'N/A'}</div>
              <div><b>Inicio:</b> ${hInicioStr}</div>
              <div><b>Fin:</b> ${hFinStr}</div>
              <div><b>Duración:</b> ${reg.duracionMin ? reg.duracionMin + ' min' : elapsedMin + ' min'}</div>
              <div><b>Plan:</b> ${reg.plan}</div>
              <div><b>Reales:</b> ${reg.piezasReales}</div>
              <div><b>Delta:</b> <span style="color:${reg.delta < 0 ? 'red' : 'green'}; font-weight:bold;">${reg.delta}</span></div>
            </div>
            ${isPendingOrActive ? `<div class="badge-time">Han transcurrido ${elapsedMin} min</div>` : ''}
          `;
          naveCard.appendChild(card);
        });

        container.appendChild(naveCard);
      });

      if (hasAlarmTriggered) triggerBeep();
    }

    // Intervalo continuo de tiempo real (Actualiza contadores cada 30 segundos)
    setInterval(() => {
      if (document.getElementById('pizarra').classList.contains('active')) {
        renderPizarra();
      }
    }, 30000);

    // --- OPERADORES ---
    function cargarOperadores() {
      google.script.run.withSuccessHandler(data => {
        const tbody = document.querySelector('#tablaOperadores tbody');
        tbody.innerHTML = '';
        data.forEach(op => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${op.maquina}</b></td>
            <td>${op.operador}</td>
            <td>${op.turno}</td>
            <td>${op.fechaRegistro}</td>
            <td>${op.fechaActualizacion}</td>
          `;
          tbody.appendChild(tr);
        });
      }).getOperadores();
    }

    // --- CONFIGURACIÓN DE ALARMA ---
    function cargarConfigAlarma() {
      google.script.run.withSuccessHandler(res => {
        document.getElementById('limitMinutes').value = res.alarmMinutes;
      }).getAlarmConfig();
    }

    function guardarConfigAlarma() {
      const val = parseInt(document.getElementById('limitMinutes').value, 10);
      if (isNaN(val) || val <= 0) return alert('Ingresa un número válido de minutos.');
      
      google.script.run.withSuccessHandler(res => {
        alert('Configuración de alarma guardada con éxito.');
        alarmThresholdMin = res.alarmMinutes;
      }).saveAlarmConfig(val);
    }

    // Carga inicial
    window.onload = () => {
      cargarPizarra();
    };
  </script>
</body>
</html>
