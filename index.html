<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyGEoLUXAPebRsxnPYw18Z0PApp44lpY1-Fua0HK0on66BS1A4KlI2QfDvVtgfjjn4atQ/exec";
  let dbData = {}, currentUser = null, isAdmin = false;

  async function init() {
    try {
      let res = await fetch(API_URL);
      dbData = await res.json();
      renderDataLists();
    } catch(e) { console.error(e); }
  }

  function renderDataLists() {
    let listM = document.getElementById('listMaquinas');
    let listO = document.getElementById('listOperadores');
    listM.innerHTML = ''; listO.innerHTML = '';
    (dbData.maquinas || []).forEach(m => listM.innerHTML += `<option value="${m}">`);
    (dbData.operadores || []).forEach(o => listO.innerHTML += `<option value="${o}">`);

    fillSelect('opTurno', dbData.turnos);
    fillSelect('solTurno', dbData.turnos);
    fillSelect('solMarca', dbData.marcas);

    if(isAdmin) renderAdminLists();
    renderHistoriales();
  }

  function fillSelect(id, list) {
    let s = document.getElementById(id);
    s.innerHTML = '<option value="">Seleccione...</option>';
    (list || []).forEach(i => s.innerHTML += `<option value="${i}">${i}</option>`);
  }

  function iniciarSesion() {
    let u = document.getElementById('loginUser').value.trim();
    let p = document.getElementById('loginPass').value.trim();
    let val = (dbData.usuarios || []).find(x => x.user === u && x.pass === p);

    if(val) {
      currentUser = u; isAdmin = false;
      document.getElementById('userDisp').textContent = `Supervisor: ${u}`;
      document.getElementById('secLogin').classList.add('hidden');
      document.getElementById('secApp').classList.remove('hidden');
      document.getElementById('btnTabAdmin').classList.add('hidden');
      switchTab('op');
    } else { alert("Usuario o contraseña incorrectos"); }
  }

  function accesoAdminDirecto() {
    let p = prompt("Contraseña de Administrador:");
    if(p === "1234") {
      currentUser = "Admin"; isAdmin = true;
      document.getElementById('userDisp').textContent = `Rol: Administrador`;
      document.getElementById('secLogin').classList.add('hidden');
      document.getElementById('secApp').classList.remove('hidden');
      document.getElementById('btnTabAdmin').classList.remove('hidden');
      switchTab('admin');
    } else if(p) alert("Clave inválida");
  }

  function cerrarSesion() { location.reload(); }

  function switchTab(t) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'admin-active'));
    document.getElementById('formOperadores').classList.add('hidden');
    document.getElementById('formSolubles').classList.add('hidden');
    document.getElementById('panelAdmin').classList.add('hidden');

    if(t === 'op') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('formOperadores').classList.remove('hidden');
    } else if(t === 'sol') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('formSolubles').classList.remove('hidden');
    } else if(t === 'admin') {
      document.querySelectorAll('.tab-btn')[2].classList.add('admin-active');
      document.getElementById('panelAdmin').classList.remove('hidden');
      renderAdminLists();
    }
  }

  async function guardarOperador(e) {
    e.preventDefault();
    let id = document.getElementById('editOpId').value;
    let payload = {
      action: id ? "EDIT_REGISTRO_OP" : "ADD_REGISTRO_OP",
      id: id || new Date().getTime(),
      fecha: document.getElementById('opFecha').value,
      hora: new Date().toLocaleTimeString(),
      maquina: document.getElementById('opMaquina').value,
      operador: document.getElementById('opTitular').value,
      cubre: document.getElementById('opCubre').value || "Ninguno",
      comentarios: document.getElementById('opComentarios').value,
      turno: document.getElementById('opTurno').value,
      usuario: currentUser
    };

    // Actualización RÁPIDA local
    if(id) {
      let idx = dbData.registrosOperadores.findIndex(x => x.id == id);
      if(idx !== -1) dbData.registrosOperadores[idx] = { ...dbData.registrosOperadores[idx], maquina: payload.maquina, col4: payload.operador, col5: payload.cubre, col6: payload.comentarios, col7: payload.turno };
    } else {
      dbData.registrosOperadores.unshift({ id: payload.id, fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.operador, col5: payload.cubre, col6: payload.comentarios, col7: payload.turno });
    }
    renderHistoriales();

    postData(payload); // Envío en segundo plano
    e.target.reset();
    document.getElementById('editOpId').value = '';
    document.getElementById('btnSaveOp').textContent = "Guardar Registro";
  }

  async function guardarSoluble(e) {
    e.preventDefault();
    let id = document.getElementById('editSolId').value;
    let payload = {
      action: id ? "EDIT_REGISTRO_SOL" : "ADD_REGISTRO_SOL",
      id: id || new Date().getTime(),
      fecha: document.getElementById('solFecha').value,
      hora: new Date().toLocaleTimeString(),
      maquina: document.getElementById('solMaquina').value,
      brixAnt: document.getElementById('solBrixAnt').value,
      brixNue: document.getElementById('solBrixNue').value,
      phAnt: document.getElementById('solPhAnt').value,
      phNue: document.getElementById('solPhNue').value,
      marca: document.getElementById('solMarca').value,
      turno: document.getElementById('solTurno').value,
      usuario: currentUser
    };

    if(id) {
      let idx = dbData.registrosSolubles.findIndex(x => x.id == id);
      if(idx !== -1) dbData.registrosSolubles[idx] = { ...dbData.registrosSolubles[idx], maquina: payload.maquina, col4: payload.brixAnt, col5: payload.brixNue, col6: payload.phAnt, col7: payload.phNue, col8: payload.marca, col9: payload.turno };
    } else {
      dbData.registrosSolubles.unshift({ id: payload.id, fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.brixAnt, col5: payload.brixNue, col6: payload.phAnt, col7: payload.phNue, col8: payload.marca, col9: payload.turno });
    }
    renderHistoriales();

    postData(payload);
    e.target.reset();
    document.getElementById('editSolId').value = '';
    document.getElementById('btnSaveSol').textContent = "Capturar Soluble";
  }

  function renderHistoriales() {
    let divOp = document.getElementById('historialOp');
    let divSol = document.getElementById('historialSol');
    divOp.innerHTML = ''; divSol.innerHTML = '';

    (dbData.registrosOperadores || []).forEach(r => {
      divOp.innerHTML += `
        <div class="item-row" style="flex-direction:column; align-items:flex-start;">
          <div>
            <b>${r.maquina}</b> - Op: ${r.col4} (Cubre: ${r.col5})<br>
            <small style="color:#64748b;">${r.fecha} | Turno: ${r.col7}</small>
          </div>
          <div class="item-actions" style="margin-top:5px;">
            <button class="btn-edit" onclick="cargarEdicionOp('${r.id}')">✏️ Editar</button>
            <button class="btn-danger" onclick="eliminarRegistro('OPERADOR', '${r.id}')">🗑️ Borrar</button>
          </div>
        </div>`;
    });

    (dbData.registrosSolubles || []).forEach(r => {
      divSol.innerHTML += `
        <div class="item-row" style="flex-direction:column; align-items:flex-start;">
          <div>
            <b>${r.maquina}</b> - Brix: ${r.col4} ➔ ${r.col5} | pH: ${r.col6} ➔ ${r.col7}<br>
            <small style="color:#64748b;">Marca: ${r.col8} | Turno: ${r.col9}</small>
          </div>
          <div class="item-actions" style="margin-top:5px;">
            <button class="btn-edit" onclick="cargarEdicionSol('${r.id}')">✏️ Editar</button>
            <button class="btn-danger" onclick="eliminarRegistro('SOLUBLE', '${r.id}')">🗑️ Borrar</button>
          </div>
        </div>`;
    });
  }

  function eliminarRegistro(tipo, id) {
    if(confirm("¿Estás seguro de borrar este registro?")) {
      if(tipo === 'OPERADOR') {
        dbData.registrosOperadores = dbData.registrosOperadores.filter(x => x.id != id);
        postData({ action: 'DELETE_REGISTRO_OP', id: id });
      } else {
        dbData.registrosSolubles = dbData.registrosSolubles.filter(x => x.id != id);
        postData({ action: 'DELETE_REGISTRO_SOL', id: id });
      }
      renderHistoriales(); // Refresco instantáneo
    }
  }

  function cargarEdicionOp(id) {
    let r = dbData.registrosOperadores.find(x => x.id == id);
    if(!r) return;
    document.getElementById('editOpId').value = r.id;
    document.getElementById('opMaquina').value = r.maquina;
    document.getElementById('opFecha').value = r.fecha;
    document.getElementById('opTurno').value = r.col7;
    document.getElementById('opTitular').value = r.col4;
    document.getElementById('opCubre').value = r.col5;
    document.getElementById('opComentarios').value = r.col6;
    document.getElementById('btnSaveOp').textContent = "Actualizar Registro";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function cargarEdicionSol(id) {
    let r = dbData.registrosSolubles.find(x => x.id == id);
    if(!r) return;
    document.getElementById('editSolId').value = r.id;
    document.getElementById('solMaquina').value = r.maquina;
    document.getElementById('solFecha').value = r.fecha;
    document.getElementById('solTurno').value = r.col9;
    document.getElementById('solBrixAnt').value = r.col4;
    document.getElementById('solBrixNue').value = r.col5;
    document.getElementById('solPhAnt').value = r.col6;
    document.getElementById('solPhNue').value = r.col7;
    document.getElementById('solMarca').value = r.col8;
    document.getElementById('btnSaveSol').textContent = "Actualizar Soluble";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  /* RENDER ADMIN EN FILAS */
  function renderAdminLists() {
    renderSubList('listAdminMaquinas', dbData.maquinas, 'Maquinas');
    renderSubList('listAdminOperadores', dbData.operadores, 'Operadores');
    renderSubList('listAdminTurnos', dbData.turnos, 'Turnos');
    renderSubList('listAdminMarcas', dbData.marcas, 'Marcas');
    
    let uDiv = document.getElementById('listAdminUsuarios');
    uDiv.innerHTML = '';
    (dbData.usuarios || []).forEach(u => {
      uDiv.innerHTML += `
        <div class="item-row">
          <span><b>${u.user}</b></span>
          <div class="item-actions">
            <button class="btn-danger" onclick="delCat('Usuarios', '${u.user}')">🗑️ Borrar</button>
          </div>
        </div>`;
    });
  }

  function renderSubList(elemId, arr, cat) {
    let d = document.getElementById(elemId);
    d.innerHTML = '';
    (arr || []).forEach(i => {
      d.innerHTML += `
        <div class="item-row">
          <span>${i}</span>
          <div class="item-actions">
            <button class="btn-edit" onclick="editCat('${cat}', '${i}')">✏️</button>
            <button class="btn-danger" onclick="delCat('${cat}', '${i}')">🗑️</button>
          </div>
        </div>`;
    });
  }

  function addCat(cat, inputId) {
    let v = document.getElementById(inputId).value.trim();
    if(!v) return;
    let key = cat.toLowerCase();
    if(dbData[key]) dbData[key].push(v);
    renderDataLists();
    postData({ action: "MANAGE_CATALOGO", op: "ADD", catalogo: cat, val1: v });
    document.getElementById(inputId).value = '';
  }

  function delCat(cat, val) {
    if(confirm(`¿Eliminar ${val}?`)) {
      let key = cat.toLowerCase();
      if(key === 'usuarios') dbData.usuarios = dbData.usuarios.filter(x => x.user !== val);
      else if(dbData[key]) dbData[key] = dbData[key].filter(x => x !== val);
      renderDataLists();
      postData({ action: "MANAGE_CATALOGO", op: "DELETE", catalogo: cat, val1: val });
    }
  }

  function editCat(cat, val) {
    let n = prompt("Nuevo nombre para:", val);
    if(n && n.trim() !== "" && n !== val) {
      let key = cat.toLowerCase();
      if(dbData[key]) {
        let idx = dbData[key].indexOf(val);
        if(idx !== -1) dbData[key][idx] = n.trim();
      }
      renderDataLists();
      postData({ action: "MANAGE_CATALOGO", op: "EDIT", catalogo: cat, val1: val, newVal1: n.trim() });
    }
  }

  function addUser() {
    let u = document.getElementById('addUser').value.trim();
    let p = document.getElementById('addPass').value.trim();
    if(!u || !p) return;
    dbData.usuarios.push({ user: u, pass: p });
    renderDataLists();
    postData({ action: "MANAGE_CATALOGO", op: "ADD", catalogo: "Usuarios", val1: u, val2: p });
    document.getElementById('addUser').value = ''; document.getElementById('addPass').value = '';
  }

  function postData(data) {
    fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
  }

  document.addEventListener("DOMContentLoaded", () => {
    init();
    document.querySelectorAll('input[type="date"]').forEach(i => i.valueAsDate = new Date());
  });
</script>
