<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyGEoLUXAPebRsxnPYw18Z0PApp44lpY1-Fua0HK0on66BS1A4KlI2QfDvVtgfjjn4atQ/exec";
  let dbData = { maquinas:[], operadores:[], turnos:[], marcas:[], usuarios:[], registrosOperadores:[], registrosSolubles:[] };
  let currentUser = null, isAdmin = false;

  function getTodayString() {
    let d = new Date();
    let year = d.getFullYear();
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // Detecta el supervisor de un registro buscando en cualquier propiedad posible
  function getSupervisorFromRecord(r) {
    let u = r.usuario || r.user || r.supervisor || r.col10 || r.col9 || r.col8;
    if (!u || u === 'N/A' || u === 'undefined') return "Desconocido";
    return String(u).trim();
  }

  function normalizeDateStr(fechaRaw) {
    if (!fechaRaw) return "";
    let str = String(fechaRaw).trim();
    if (str.includes("T")) str = str.split("T")[0];
    
    if (str.includes('-')) {
      let parts = str.split('-');
      if (parts[0].length === 4) return str;
      return `${parts[2]}-${String(parts[1]).padStart(2,'0')}-${String(parts[0]).padStart(2,'0')}`;
    } else if (str.includes('/')) {
      let parts = str.split('/');
      if (parts[2].length === 4) {
        return `${parts[2]}-${String(parts[1]).padStart(2,'0')}-${String(parts[0]).padStart(2,'0')}`;
      }
    }
    return str;
  }

  async function init() {
    try {
      let res = await fetch(API_URL);
      let data = await res.json();
      dbData = {
        maquinas: data.maquinas || [],
        operadores: data.operadores || [],
        turnos: data.turnos || [],
        marcas: data.marcas || [],
        usuarios: data.usuarios || [],
        registrosOperadores: data.registrosOperadores || [],
        registrosSolubles: data.registrosSolubles || []
      };
      renderDataLists();
    } catch(e) { console.error("Error al cargar los datos:", e); }
  }

  function renderDataLists() {
    let listM = document.getElementById('listMaquinas');
    let listO = document.getElementById('listOperadores');
    listM.innerHTML = ''; listO.innerHTML = '';
    dbData.maquinas.forEach(m => listM.innerHTML += `<option value="${m}">`);
    dbData.operadores.forEach(o => listO.innerHTML += `<option value="${o}">`);

    fillSelect('opTurno', dbData.turnos);
    fillSelect('solTurno', dbData.turnos);
    fillSelect('solMarca', dbData.marcas);

    // Llenar selector de usuarios para filtro Admin
    let selAdminU = document.getElementById('adminFilterUser');
    selAdminU.innerHTML = '<option value="ALL">-- Todos los Supervisores --</option>';
    dbData.usuarios.forEach(u => selAdminU.innerHTML += `<option value="${u.user}">${u.user}</option>`);

    if(isAdmin) renderAdminLists();
    renderHistoriales();
  }

  function fillSelect(id, list) {
    let s = document.getElementById(id);
    s.innerHTML = '<option value="">Seleccione...</option>';
    (list || []).forEach(i => s.innerHTML += `<option value="${i}">${i}</option>`);
  }

  function iniciarSesion() {
    let u = document.getElementById('loginUser').value.trim();
    let p = document.getElementById('loginPass').value.trim();
    let val = dbData.usuarios.find(x => x.user.toLowerCase() === u.toLowerCase() && x.pass === p);

    if(val) {
      currentUser = val.user; isAdmin = false;
      document.getElementById('userDisp').textContent = `Supervisor: ${currentUser}`;
      document.getElementById('secLogin').classList.add('hidden');
      document.getElementById('secApp').classList.remove('hidden');
      document.getElementById('btnTabAdmin').classList.add('hidden');
      document.getElementById('btnTabAdminHist').classList.add('hidden');
      switchTab('op');
    } else { alert("Usuario o contraseña incorrectos"); }
  }

  function accesoAdminDirecto() {
    let p = prompt("Contraseña de Administrador:");
    if(p === "1234") {
      currentUser = "Admin"; isAdmin = true;
      document.getElementById('userDisp').textContent = `Rol: Administrador`;
      document.getElementById('secLogin').classList.add('hidden');
      document.getElementById('secApp').classList.remove('hidden');
      document.getElementById('btnTabAdmin').classList.remove('hidden');
      document.getElementById('btnTabAdminHist').classList.remove('hidden');
      switchTab('adminHist');
    } else if(p) alert("Clave inválida");
  }

  function cerrarSesion() { location.reload(); }

  function switchTab(t) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'admin-active'));
    document.getElementById('formOperadores').classList.add('hidden');
    document.getElementById('formSolubles').classList.add('hidden');
    document.getElementById('panelAdminHistorial').classList.add('hidden');
    document.getElementById('panelAdmin').classList.add('hidden');

    if(t === 'op') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('formOperadores').classList.remove('hidden');
      renderHistoriales();
    } else if(t === 'sol') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('formSolubles').classList.remove('hidden');
      renderHistoriales();
    } else if(t === 'adminHist') {
      document.getElementById('btnTabAdminHist').classList.add('admin-active');
      document.getElementById('panelAdminHistorial').classList.remove('hidden');
      renderAdminHistorial();
    } else if(t === 'admin') {
      document.getElementById('btnTabAdmin').classList.add('admin-active');
      document.getElementById('panelAdmin').classList.remove('hidden');
      renderAdminLists();
    }
  }

  function guardarOperador(e) {
    e.preventDefault();
    let id = document.getElementById('editOpId').value;
    let fechaVal = document.getElementById('opFecha').value;
    let payload = {
      action: id ? "EDIT_REGISTRO_OP" : "ADD_REGISTRO_OP",
      id: id || ("ID_" + new Date().getTime()),
      fecha: fechaVal,
      hora: new Date().toLocaleTimeString(),
      maquina: document.getElementById('opMaquina').value,
      operador: document.getElementById('opTitular').value,
      cubre: document.getElementById('opCubre').value || "Ninguno",
      comentarios: document.getElementById('opComentarios').value,
      turno: document.getElementById('opTurno').value,
      usuario: currentUser
    };

    if(id) {
      let idx = dbData.registrosOperadores.findIndex(x => x.id == id);
      if(idx !== -1) dbData.registrosOperadores[idx] = { ...dbData.registrosOperadores[idx], fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.operador, col5: payload.cubre, col6: payload.comentarios, col7: payload.turno, usuario: payload.usuario };
    } else {
      dbData.registrosOperadores.unshift({ id: payload.id, fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.operador, col5: payload.cubre, col6: payload.comentarios, col7: payload.turno, usuario: currentUser });
    }
    
    document.getElementById('filterOpFecha').value = fechaVal;
    renderHistoriales();
    postData(payload);

    e.target.reset();
    document.getElementById('editOpId').value = '';
    document.getElementById('btnSaveOp').textContent = "Guardar Registro";
    document.getElementById('opFecha').value = getTodayString();
  }

  function guardarSoluble(e) {
    e.preventDefault();
    let id = document.getElementById('editSolId').value;
    let fechaVal = document.getElementById('solFecha').value;
    let payload = {
      action: id ? "EDIT_REGISTRO_SOL" : "ADD_REGISTRO_SOL",
      id: id || ("ID_" + new Date().getTime()),
      fecha: fechaVal,
      hora: new Date().toLocaleTimeString(),
      maquina: document.getElementById('solMaquina').value,
      brixAnt: document.getElementById('solBrixAnt').value,
      brixNue: document.getElementById('solBrixNue').value,
      phAnt: document.getElementById('solPhAnt').value,
      phNue: document.getElementById('solPhNue').value,
      marca: document.getElementById('solMarca').value,
      turno: document.getElementById('solTurno').value,
      usuario: currentUser
    };

    if(id) {
      let idx = dbData.registrosSolubles.findIndex(x => x.id == id);
      if(idx !== -1) dbData.registrosSolubles[idx] = { ...dbData.registrosSolubles[idx], fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.brixAnt, col5: payload.brixNue, col6: payload.phAnt, col7: payload.phNue, col8: payload.marca, col9: payload.turno, usuario: payload.usuario };
    } else {
      dbData.registrosSolubles.unshift({ id: payload.id, fecha: payload.fecha, hora: payload.hora, maquina: payload.maquina, col4: payload.brixAnt, col5: payload.brixNue, col6: payload.phAnt, col7: payload.phNue, col8: payload.marca, col9: payload.turno, usuario: currentUser });
    }

    document.getElementById('filterSolFecha').value = fechaVal;
    renderHistoriales();
    postData(payload);

    e.target.reset();
    document.getElementById('editSolId').value = '';
    document.getElementById('btnSaveSol').textContent = "Capturar Soluble";
    document.getElementById('solFecha').value = getTodayString();
  }

  // RENDER HISTORIAL VISTA SUPERVISOR
  function renderHistoriales() {
    let selOpFecha = document.getElementById('filterOpFecha').value;
    let selSolFecha = document.getElementById('filterSolFecha').value;

    let divOp = document.getElementById('historialOp');
    let divSol = document.getElementById('historialSol');
    divOp.innerHTML = ''; divSol.innerHTML = '';

    let opFiltrados = dbData.registrosOperadores.filter(r => {
      let matchFecha = normalizeDateStr(r.fecha) === selOpFecha;
      let sup = getSupervisorFromRecord(r);
      let matchUser = isAdmin || sup.toLowerCase() === String(currentUser).toLowerCase() || sup === "Desconocido";
      return matchFecha && matchUser;
    });

    let solFiltrados = dbData.registrosSolubles.filter(r => {
      let matchFecha = normalizeDateStr(r.fecha) === selSolFecha;
      let sup = getSupervisorFromRecord(r);
      let matchUser = isAdmin || sup.toLowerCase() === String(currentUser).toLowerCase() || sup === "Desconocido";
      return matchFecha && matchUser;
    });

    if (opFiltrados.length === 0) {
      divOp.innerHTML = `<p style="color:#94a3b8; font-size:0.85rem; text-align:center;">No tienes registros grabados para el ${selOpFecha}.</p>`;
    } else {
      opFiltrados.forEach(r => {
        divOp.innerHTML += `
          <div class="item-row" style="flex-direction:column; align-items:flex-start;">
            <div style="width:100%;">
              <b>Máquina: ${r.maquina}</b> | Turno: ${r.col7}<br>
              <small><b>Titular:</b> ${r.col4} | <b>Cubre:</b> ${r.col5}</small><br>
              <small style="color:#64748b;">${r.col6 ? 'Obs: '+r.col6+' | ' : ''}Hora: ${r.hora || ''}</small>
            </div>
            <div class="item-actions" style="margin-top:8px; align-self:flex-end;">
              <button class="btn-edit" onclick="cargarEdicionOp('${r.id}')">✏️ Editar</button>
              <button class="btn-danger" onclick="eliminarRegistro('OPERADOR', '${r.id}')">🗑️ Borrar</button>
            </div>
          </div>`;
      });
    }

    if (solFiltrados.length === 0) {
      divSol.innerHTML = `<p style="color:#94a3b8; font-size:0.85rem; text-align:center;">No tienes registros grabados para el ${selSolFecha}.</p>`;
    } else {
      solFiltrados.forEach(r => {
        divSol.innerHTML += `
          <div class="item-row" style="flex-direction:column; align-items:flex-start;">
            <div style="width:100%;">
              <b>Máquina: ${r.maquina}</b> | Turno: ${r.col9}<br>
              <small><b>Brix:</b> ${r.col4} ➔ ${r.col5} | <b>pH:</b> ${r.col6} ➔ ${r.col7}</small><br>
              <small style="color:#64748b;">Marca: ${r.col8} | Hora: ${r.hora || ''}</small>
            </div>
            <div class="item-actions" style="margin-top:8px; align-self:flex-end;">
              <button class="btn-edit" onclick="cargarEdicionSol('${r.id}')">✏️ Editar</button>
              <button class="btn-danger" onclick="eliminarRegistro('SOLUBLE', '${r.id}')">🗑️ Borrar</button>
            </div>
          </div>`;
      });
    }
  }

  // RENDER HISTORIAL VISTA ADMIN
  function renderAdminHistorial() {
    let fecha = document.getElementById('adminFilterFecha').value;
    let userSel = document.getElementById('adminFilterUser').value;

    let divOp = document.getElementById('adminHistOp');
    let divSol = document.getElementById('adminHistSol');
    divOp.innerHTML = ''; divSol.innerHTML = '';

    let opFiltrados = dbData.registrosOperadores.filter(r => {
      let matchFecha = normalizeDateStr(r.fecha) === fecha;
      let sup = getSupervisorFromRecord(r);
      let matchUser = userSel === "ALL" || sup.toLowerCase() === userSel.toLowerCase();
      return matchFecha && matchUser;
    });

    let solFiltrados = dbData.registrosSolubles.filter(r => {
      let matchFecha = normalizeDateStr(r.fecha) === fecha;
      let sup = getSupervisorFromRecord(r);
      let matchUser = userSel === "ALL" || sup.toLowerCase() === userSel.toLowerCase();
      return matchFecha && matchUser;
    });

    if (opFiltrados.length === 0) {
      divOp.innerHTML = `<p style="color:#94a3b8; font-size:0.85rem;">No hay registros de operadores para esta fecha / filtro.</p>`;
    } else {
      opFiltrados.forEach(r => {
        let supName = getSupervisorFromRecord(r);
        divOp.innerHTML += `
          <div class="item-row" style="flex-direction:column; align-items:flex-start;">
            <div style="width:100%;">
              <span style="background:#0f172a; color:white; padding:2px 6px; border-radius:4px; font-size:0.75rem;">Supervisor: ${supName}</span>
              <b style="margin-left:5px;">${r.maquina}</b> | Turno: ${r.col7}<br>
              <small><b>Titular:</b> ${r.col4} | <b>Cubre:</b> ${r.col5}</small><br>
              <small style="color:#64748b;">${r.col6 ? 'Obs: '+r.col6+' | ' : ''}Hora: ${r.hora || ''}</small>
            </div>
            <div class="item-actions" style="margin-top:8px; align-self:flex-end;">
              <button class="btn-edit" onclick="cargarEdicionOp('${r.id}')">✏️ Editar</button>
              <button class="btn-danger" onclick="eliminarRegistro('OPERADOR', '${r.id}')">🗑️ Borrar</button>
            </div>
          </div>`;
      });
    }

    if (solFiltrados.length === 0) {
      divSol.innerHTML = `<p style="color:#94a3b8; font-size:0.85rem;">No hay registros de solubles para esta fecha / filtro.</p>`;
    } else {
      solFiltrados.forEach(r => {
        let supName = getSupervisorFromRecord(r);
        divSol.innerHTML += `
          <div class="item-row" style="flex-direction:column; align-items:flex-start;">
            <div style="width:100%;">
              <span style="background:#0f172a; color:white; padding:2px 6px; border-radius:4px; font-size:0.75rem;">Supervisor: ${supName}</span>
              <b style="margin-left:5px;">${r.maquina}</b> | Turno: ${r.col9}<br>
              <small><b>Brix:</b> ${r.col4} ➔ ${r.col5} | <b>pH:</b> ${r.col6} ➔ ${r.col7}</small><br>
              <small style="color:#64748b;">Marca: ${r.col8} | Hora: ${r.hora || ''}</small>
            </div>
            <div class="item-actions" style="margin-top:8px; align-self:flex-end;">
              <button class="btn-edit" onclick="cargarEdicionSol('${r.id}')">✏️ Editar</button>
              <button class="btn-danger" onclick="eliminarRegistro('SOLUBLE', '${r.id}')">🗑️ Borrar</button>
            </div>
          </div>`;
      });
    }
  }

  function eliminarRegistro(tipo, id) {
    if(confirm("¿Estás seguro de borrar este registro?")) {
      if(tipo === 'OPERADOR') {
        dbData.registrosOperadores = dbData.registrosOperadores.filter(x => x.id != id);
        postData({ action: 'DELETE_REGISTRO_OP', id: id });
      } else {
        dbData.registrosSolubles = dbData.registrosSolubles.filter(x => x.id != id);
        postData({ action: 'DELETE_REGISTRO_SOL', id: id });
      }
      renderHistoriales();
      if(isAdmin) renderAdminHistorial();
    }
  }

  function cargarEdicionOp(id) {
    let r = dbData.registrosOperadores.find(x => x.id == id);
    if(!r) return;
    switchTab('op');
    document.getElementById('editOpId').value = r.id;
    document.getElementById('opMaquina').value = r.maquina;
    document.getElementById('opFecha').value = normalizeDateStr(r.fecha);
    document.getElementById('opTurno').value = r.col7;
    document.getElementById('opTitular').value = r.col4;
    document.getElementById('opCubre').value = r.col5;
    document.getElementById('opComentarios').value = r.col6;
    document.getElementById('btnSaveOp').textContent = "Actualizar Registro";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function cargarEdicionSol(id) {
    let r = dbData.registrosSolubles.find(x => x.id == id);
    if(!r) return;
    switchTab('sol');
    document.getElementById('editSolId').value = r.id;
    document.getElementById('solMaquina').value = r.maquina;
    document.getElementById('solFecha').value = normalizeDateStr(r.fecha);
    document.getElementById('solTurno').value = r.col9;
    document.getElementById('solBrixAnt').value = r.col4;
    document.getElementById('solBrixNue').value = r.col5;
    document.getElementById('solPhAnt').value = r.col6;
    document.getElementById('solPhNue').value = r.col7;
    document.getElementById('solMarca').value = r.col8;
    document.getElementById('btnSaveSol').textContent = "Actualizar Soluble";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function renderAdminLists() {
    renderSubList('listAdminMaquinas', dbData.maquinas, 'Maquinas');
    renderSubList('listAdminOperadores', dbData.operadores, 'Operadores');
    renderSubList('listAdminTurnos', dbData.turnos, 'Turnos');
    renderSubList('listAdminMarcas', dbData.marcas, 'Marcas');
    
    let uDiv = document.getElementById('listAdminUsuarios');
    uDiv.innerHTML = '';
    dbData.usuarios.forEach(u => {
      uDiv.innerHTML += `
        <div class="item-row">
          <span><b>${u.user}</b></span>
          <div class="item-actions">
            <button class="btn-danger" onclick="delCat('Usuarios', '${u.user}')">🗑️ Borrar</button>
          </div>
        </div>`;
    });
  }

  function renderSubList(elemId, arr, cat) {
    let d = document.getElementById(elemId);
    d.innerHTML = '';
    arr.forEach(i => {
      d.innerHTML += `
        <div class="item-row">
          <span>${i}</span>
          <div class="item-actions">
            <button class="btn-edit" onclick="editCat('${cat}', '${i}')">✏️</button>
            <button class="btn-danger" onclick="delCat('${cat}', '${i}')">🗑️</button>
          </div>
        </div>`;
    });
  }

  function addCat(cat, inputId) {
    let v = document.getElementById(inputId).value.trim();
    if(!v) return;
    let key = cat.toLowerCase();
    if(dbData[key]) dbData[key].push(v);
    renderDataLists();
    postData({ action: "MANAGE_CATALOGO", op: "ADD", catalogo: cat, val1: v });
    document.getElementById(inputId).value = '';
  }

  function delCat(cat, val) {
    if(confirm(`¿Eliminar ${val}?`)) {
      let key = cat.toLowerCase();
      if(key === 'usuarios') dbData.usuarios = dbData.usuarios.filter(x => x.user !== val);
      else if(dbData[key]) dbData[key] = dbData[key].filter(x => x !== val);
      renderDataLists();
      postData({ action: "MANAGE_CATALOGO", op: "DELETE", catalogo: cat, val1: val });
    }
  }

  function editCat(cat, val) {
    let n = prompt("Nuevo nombre para:", val);
    if(n && n.trim() !== "" && n !== val) {
      let key = cat.toLowerCase();
      if(key in dbData) {
        let idx = dbData[key].indexOf(val);
        if(idx !== -1) dbData[key][idx] = n.trim();
      }
      renderDataLists();
      postData({ action: "MANAGE_CATALOGO", op: "EDIT", catalogo: cat, val1: val, newVal1: n.trim() });
    }
  }

  function addUser() {
    let u = document.getElementById('addUser').value.trim();
    let p = document.getElementById('addPass').value.trim();
    if(!u || !p) return;
    dbData.usuarios.push({ user: u, pass: p });
    renderDataLists();
    postData({ action: "MANAGE_CATALOGO", op: "ADD", catalogo: "Usuarios", val1: u, val2: p });
    document.getElementById('addUser').value = ''; document.getElementById('addPass').value = '';
  }

  function postData(data) {
    fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
  }

  document.addEventListener("DOMContentLoaded", () => {
    init();
    let today = getTodayString();
    document.querySelectorAll('input[type="date"]').forEach(i => i.value = today);
  });
</script>
