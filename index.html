<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Planta</title>
  <style>
    :root { --primary: #0284c7; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #1e293b; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; }
    select, input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; margin-top: 15px; cursor: pointer; }
    button:active { opacity: 0.9; }
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { background: #e2e8f0; color: #475569; padding: 10px; border-radius: 6px; flex: 1; border: none; font-weight: bold; }
    .tab-btn.active { background: var(--primary); color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('op')">Operadores</button>
    <button class="tab-btn" onclick="switchTab('sol')">Solubles</button>
  </div>

  <!-- FORMULARIO OPERADORES -->
  <form id="formOperadores" class="card" onsubmit="enviarDatos(event, 'OPERADOR')">
    <h2>Registro de Operadores</h2>
    
    <label>Máquina</label>
    <select id="opMaquina" required></select>

    <label>Fecha</label>
    <input type="date" id="opFecha" required>

    <label>Operador Titular</label>
    <select id="opTitular" required><option value="">Cargando...</option></select>

    <label>Operador que Cubre</label>
    <select id="opCubre"><option value="">Ninguno</option></select>

    <label>Comentarios</label>
    <textarea id="opComentarios" rows="3"></textarea>

    <button type="submit">Guardar Información</button>
  </form>

  <!-- FORMULARIO SOLUBLES -->
  <form id="formSolubles" class="card hidden" onsubmit="enviarDatos(event, 'SOLUBLE')">
    <h2>Registro de Soluble</h2>
    
    <label>Máquina</label>
    <select id="solMaquina" required></select>

    <label>Fecha</label>
    <input type="date" id="solFecha" required>

    <label>% Brix Anterior</label>
    <input type="number" step="0.1" id="solBrixAnt" required>

    <label>% Brix Nuevo</label>
    <input type="number" step="0.1" id="solBrixNue" required>

    <label>pH Anterior</label>
    <input type="number" step="0.1" id="solPhAnt" required>

    <label>pH Nuevo</label>
    <input type="number" step="0.1" id="solPhNue" required>

    <label>Marca de Soluble</label>
    <input type="text" id="solMarca" required>

    <button type="submit">Capturar Soluble</button>
  </form>
</div>

<script>
  // PEGA AQUÍ LA URL QUE TE DIO GOOGLE APPS SCRIPT
  const API_URL = https://script.google.com/macros/s/AKfycbyGEoLUXAPebRsxnPYw18Z0PApp44lpY1-Fua0HK0on66BS1A4KlI2QfDvVtgfjjn4atQ/exec;

  // Llenar máquinas de CM1 a CM25
  function cargarMaquinas() {
    let selects = [document.getElementById('opMaquina'), document.getElementById('solMaquina')];
    selects.forEach(s => {
      s.innerHTML = '';
      for(let i=1; i<=25; i++) {
        let opt = document.createElement('option');
        opt.value = `CM${i}`;
        opt.textContent = `CM${i}`;
        s.appendChild(opt);
      }
    });
  }

  // Obtener lista de operadores desde Google Sheets
  async function cargarOperadores() {
    try {
      let res = await fetch(API_URL);
      let ops = await res.json();
      let selects = [document.getElementById('opTitular'), document.getElementById('opCubre')];
      
      selects.forEach((s, idx) => {
        s.innerHTML = idx === 1 ? '<option value="">Ninguno</option>' : '<option value="">Seleccione...</option>';
        ops.forEach(op => {
          let option = document.createElement('option');
          option.value = op;
          option.textContent = op;
          s.appendChild(option);
        });
      });
    } catch(e) {
      alert("Error al cargar la lista de operadores");
    }
  }

  function obtenerTurno() {
    let hora = new Date().getHours();
    return (hora >= 7 && hora < 19) ? "Día (7AM-7PM)" : "Noche (7PM-7AM)";
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(tab === 'op') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('formOperadores').classList.remove('hidden');
      document.getElementById('formSolubles').classList.add('hidden');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('formSolubles').classList.remove('hidden');
      document.getElementById('formOperadores').classList.add('hidden');
    }
  }

  async function enviarDatos(e, tipo) {
    e.preventDefault();
    let ahora = new Date();
    let horaStr = ahora.toLocaleTimeString();

    let payload = { tipo: tipo, hora: horaStr, turno: obtenerTurno() };

    if(tipo === 'OPERADOR') {
      payload.maquina = document.getElementById('opMaquina').value;
      payload.fecha = document.getElementById('opFecha').value;
      payload.operador = document.getElementById('opTitular').value;
      payload.cubre = document.getElementById('opCubre').value;
      payload.comentarios = document.getElementById('opComentarios').value;
    } else {
      payload.maquina = document.getElementById('solMaquina').value;
      payload.fecha = document.getElementById('solFecha').value;
      payload.brixAnterior = document.getElementById('solBrixAnt').value;
      payload.brixNuevo = document.getElementById('solBrixNue').value;
      payload.phAnterior = document.getElementById('solPhAnt').value;
      payload.phNuevo = document.getElementById('solPhNue').value;
      payload.marca = document.getElementById('solMarca').value;
    }

    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      alert("¡Registro guardado con éxito!");
      e.target.reset();
      document.querySelectorAll('input[type="date"]').forEach(i => i.valueAsDate = new Date());
    } catch(err) {
      alert("Error al enviar el registro");
    }
  }

  window.onload = () => {
    cargarMaquinas();
    cargarOperadores();
    document.querySelectorAll('input[type="date"]').forEach(i => i.valueAsDate = new Date());
  };
</script>

</body>
</html>
